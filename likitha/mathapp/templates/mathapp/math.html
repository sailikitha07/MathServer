<html>
<head>
  <style>
    body {
      background-image: url('C:\Users\admin\MathServer\likitha\mathapp\templates\mathapp\math.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .overlay {
      background: linear-gradient(135deg, rgba(255, 255, 0, 0.5), rgba(3, 65, 94, 0.7)); /* Gradient overlay */
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    h1 {
      color: white;
      font-style: oblique;
      text-align: center;
      font-size: 70px;
    }
    .inputs {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: rgba(72, 146, 159, 0.8); /* Slightly transparent background */
      width: 400px;
      height: 300px;
      padding: 20px;
      border-radius: 10px;
    }
    form {
      display: flex;
      flex-direction: column;
      width: 100%;
      gap: 10px;
    }
    label {
      font-size: 20px;
      color: rgb(22, 24, 12);
    }
    input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
      width: 100%;
    }
    button {
      padding: 10px;
      background-color: rgb(191, 51, 96);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <h1>Power of a Lamp Filament</h1><br>
    <div class="inputs">
      <form method="POST">
        {% csrf_token %}
        <label for="input1">Enter the intensity of the bulb:</label>
        <input type="number" id="input1" name="intensity" placeholder="Enter Intensity" value="{{I}}">
        <label for="input2">Enter the resistance of the bulb:</label>
        <input type="number" id="input2" name="resistance" placeholder="Enter Resistance" value="{{R}}">
        <button type="submit">Calculate</button>
      </form>
      <label for="ans">Answer (in watts):</label>
      <input type="text" id="ans" value="{{power}}" readonly>
    </div>
  </div>
</body>
</html>
